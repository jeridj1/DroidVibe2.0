name: CI

on:
  push:
    branches: [main, vibe-flashing-fixes]
  pull_request:
    branches: [main, vibe-flashing-fixes]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  quality:
    name: Typecheck and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm typecheck > /tmp/tsc-output.txt 2>&1
          code=$?
          cat /tmp/tsc-output.txt
          if [ $code -ne 0 ]; then
            {
              echo "## Full Typecheck Output"
              echo ""
              echo "Commit: ${{ github.sha }}"
              echo '~~~'
              cat /tmp/tsc-output.txt
              echo '~~~'
            } > /tmp/tc-issue.md
            gh issue create --title "CI: Typecheck failure (${{ github.sha }})" --body-file /tmp/tc-issue.md || true
            exit 1
          fi
      - name: Upload typecheck output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-output
          path: /tmp/tsc-output.txt
          if-no-files-found: ignore
      - run: pnpm lint

  web-build:
    name: Build Web Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @droidvibe/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test

  mobile-prebuild:
    name: Expo Prebuild Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Generate PNG assets from SVG sources
        run: |
          npm install --prefix /tmp/asset-tools sharp
          NODE_PATH=/tmp/asset-tools/node_modules node scripts/generate-assets.js
      - name: Expo prebuild
        working-directory: apps/mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm exec expo prebuild --platform android --no-install --clean > /tmp/prebuild-output.txt 2>&1
          code=$?
          cat /tmp/prebuild-output.txt
          if [ $code -ne 0 ]; then
            {
              echo "## Expo Prebuild Failure"
              echo "Commit: ${{ github.sha }}"
              echo '~~~'
              cat /tmp/prebuild-output.txt
              echo '~~~'
            } > /tmp/pb-issue.md
            gh issue create --title "CI: Expo prebuild failure (${{ github.sha }})" --body-file /tmp/pb-issue.md || true
            exit 1
          fi

  toolchain:
    name: Build ARM64 Arduino Toolchain
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    needs: mobile-prebuild
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify on native ARM64
        run: |
          chmod +x scripts/build-mobile-toolchain.sh
          scripts/build-mobile-toolchain.sh "$RUNNER_TEMP/droidvibe-assets"
          test -s "$RUNNER_TEMP/droidvibe-assets/droidvibe-toolchain-proot"
          compgen -G "$RUNNER_TEMP/droidvibe-assets/droidvibe-toolchain-rootfs.tar.gz.part-*" >/dev/null
      - name: Upload verified toolchain
        uses: actions/upload-artifact@v4
        with:
          name: droidvibe-local-toolchain
          path: |
            ${{ runner.temp }}/droidvibe-assets/droidvibe-toolchain-rootfs.tar.gz.part-*
            ${{ runner.temp }}/droidvibe-assets/droidvibe-toolchain-proot
          if-no-files-found: error
          retention-days: 30

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [mobile-prebuild, toolchain]
    env:
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: gradle-debug-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-debug-${{ runner.os }}-
      - run: pnpm install --no-frozen-lockfile
      - name: Generate PNG assets from SVG sources
        run: |
          npm install --prefix /tmp/asset-tools sharp
          NODE_PATH=/tmp/asset-tools/node_modules node scripts/generate-assets.js
      - name: Expo prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Download verified ARM64 toolchain
        uses: actions/download-artifact@v4
        with:
          name: droidvibe-local-toolchain
          path: apps/mobile/android/app/src/main/assets
      - name: Verify bundled toolchain files
        run: |
          test -s apps/mobile/android/app/src/main/assets/droidvibe-toolchain-proot
          compgen -G 'apps/mobile/android/app/src/main/assets/droidvibe-toolchain-rootfs.tar.gz.part-*' >/dev/null
      - name: Build RP2040 logic analyzer helper
        env:
          PICO_SDK_VERSION: 2.1.1
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build
          rm -rf /tmp/pico-sdk /tmp/rp2040-build
          git clone --depth 1 --branch "${PICO_SDK_VERSION}" --recurse-submodules https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk
          cp /tmp/pico-sdk/external/pico_sdk_import.cmake firmware/rp2040-logic-analyzer/pico_sdk_import.cmake
          PICO_SDK_PATH=/tmp/pico-sdk cmake -S firmware/rp2040-logic-analyzer -B /tmp/rp2040-build -G Ninja
          cmake --build /tmp/rp2040-build --parallel 2
          test -s /tmp/rp2040-build/droidvibe_rp2040_logic_analyzer.uf2
          mkdir -p apps/mobile/src/lib/generated
          {
            echo '/** Generated by CI from firmware/rp2040-logic-analyzer. */'
            echo 'export const RP2040_LOGIC_ANALYZER_UF2_BASE64 = '
            printf "'"
            base64 -w0 /tmp/rp2040-build/droidvibe_rp2040_logic_analyzer.uf2
            echo "';"
          } > apps/mobile/src/lib/generated/rp2040LogicAnalyzerFirmware.ts
          wc -c /tmp/rp2040-build/droidvibe_rp2040_logic_analyzer.uf2 apps/mobile/src/lib/generated/rp2040LogicAnalyzerFirmware.ts
      - name: Upload RP2040 helper UF2
        uses: actions/upload-artifact@v4
        with:
          name: droidvibe-rp2040-logic-analyzer-uf2
          path: /tmp/rp2040-build/droidvibe_rp2040_logic_analyzer.uf2
          if-no-files-found: error
          retention-days: 30
      - name: Accept SDK licenses & install components
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 2>&1 || true
      - name: Patch build config
        working-directory: apps/mobile/android
        run: |
          if [ -f gradle.properties ]; then
            if grep -q 'android.kotlinVersion=' gradle.properties; then
              sed -i 's/android.kotlinVersion=.*/android.kotlinVersion=1.9.25/' gradle.properties
            else
              echo 'android.kotlinVersion=1.9.25' >> gradle.properties
            fi
          else
            echo 'android.kotlinVersion=1.9.25' > gradle.properties
          fi
          grep -q 'kotlin.jvm.target.validation.mode' gradle.properties || echo 'kotlin.jvm.target.validation.mode=warning' >> gradle.properties
          grep -q 'org.gradle.jvmargs' gradle.properties || echo 'org.gradle.jvmargs=-Xmx3g' >> gradle.properties
          grep -q 'org.gradle.parallel' gradle.properties || echo 'org.gradle.parallel=true' >> gradle.properties
          grep -q 'org.gradle.caching' gradle.properties || echo 'org.gradle.caching=true' >> gradle.properties
          if [ -f build.gradle ]; then
            sed -i 's/ndkVersion = .*/ndkVersion = "27.3.13750724"/' build.gradle
          fi
          if [ -f app/build.gradle ]; then
            if ! grep -q 'buildConfig = true' app/build.gradle; then
              if grep -q 'buildConfig = false' app/build.gradle; then
                sed -i 's/buildConfig = false/buildConfig = true/g' app/build.gradle
              elif grep -q 'buildFeatures {' app/build.gradle; then
                sed -i '/buildFeatures {/a\\        buildConfig = true' app/build.gradle
              elif grep -q 'android {' app/build.gradle; then
                sed -i '/android {/a\\    buildFeatures {\\n        buildConfig = true\\n    }' app/build.gradle
              fi
            fi
            if ! grep -q 'namespace "com.droidvibe.app"' app/build.gradle; then
              if grep -q 'namespace "' app/build.gradle; then
                sed -i 's/namespace "[^"]*\"/namespace "com.droidvibe.app\"/' app/build.gradle
              elif grep -q 'android {' app/build.gradle; then
                sed -i '/android {/a\\    namespace "com.droidvibe.app"' app/build.gradle
              fi
            fi
          fi
      - name: Bundle JavaScript
        working-directory: apps/mobile
        run: |
          pnpm add -D @react-native-community/cli@latest 2>&1 | tee /tmp/bundle-output.txt
          echo "import 'expo-router/entry';" > index.js
          mkdir -p android/app/src/main/assets
          pnpm exec react-native bundle \\
            --platform android \\
            --dev false \\
            --entry-file "$(pwd)/index.js" \\
            --bundle-output android/app/src/main/assets/index.android.bundle \\
            --assets-dest android/app/src/main/res/ \\
            --max-workers 2 \\
            --verbose 2>&1 | tee -a /tmp/bundle-output.txt
          code=${PIPESTATUS[0]}
          rm -f index.js
          [ $code -eq 0 ] || exit $code
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --parallel --build-cache --stacktrace 2>&1 | tee /tmp/build-output.txt
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: droidvibe-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Report build error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Android APK Build Failure"
            echo "Commit: ${{ github.sha }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '### Bundle Output'
            echo '~~~'
            cat /tmp/bundle-output.txt 2>/dev/null || true
            echo '~~~'
            echo '### Build Output (last 100 lines)'
            echo '~~~'
            tail -100 /tmp/build-output.txt 2>/dev/null || true
            echo '~~~'
          } > /tmp/apk-issue.md
          gh issue create --title "CI: Android APK build failure (${{ github.sha }})" --body-file /tmp/apk-issue.md || true
